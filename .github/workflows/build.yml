name: Build and proxy regressions

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
          - os: ubuntu-24.04
            cc: clang
          - os: macos-15-intel
            cc: clang
          - os: macos-15
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libevent on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libevent-dev pkg-config
      - name: Install libevent on macOS
        if: runner.os == 'macOS'
        run: brew install libevent pkgconf
      - name: Build
        run: make -j2 CC=${{ matrix.cc }}
      - name: TCP and UDP regression tests
        run: make check CC=${{ matrix.cc }}
      - name: macOS sample configurations
        if: runner.os == 'macOS'
        run: |
          ./redsocks -t -c examples/redsocks-macos.conf
          ./redsocks -t -c examples/redsocks-macos-udp.conf
          ./redsocks -t -c examples/redsocks-macos-udp-fixed.conf
      - name: PF forwarding on disposable macOS runner
        if: runner.os == 'macOS'
        run: |
          sudo /sbin/pfctl -f /etc/pf.conf
          sudo python3 tests/macos_pf_test.py
          sudo python3 tests/macos_udp_test.py
      - name: Debug build
        run: |
          make clean
          make -j2 DBG_BUILD=1 CC=${{ matrix.cc }}
