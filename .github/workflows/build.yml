name: Build and proxy regressions

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
          - os: ubuntu-24.04
            cc: clang
          - os: macos-15-intel
            cc: clang
          - os: macos-15
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - name: Install libevent on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libevent-dev pkg-config
      - name: Install libevent on macOS
        if: runner.os == 'macOS'
        run: |
          for formula in libevent pkgconf; do
            brew list --versions "$formula" >/dev/null || brew install "$formula"
          done
      - name: Build
        run: make -j2 CC=${{ matrix.cc }}
      - name: TCP and UDP regression tests
        run: make check CC=${{ matrix.cc }}
      - name: macOS sample configurations
        if: runner.os == 'macOS'
        run: |
          ./redsocks -t -c examples/redsocks-macos.conf
          ./redsocks -t -c examples/redsocks-macos-udp.conf
          ./redsocks -t -c examples/redsocks-macos-udp-fixed.conf
          ./redsocks -t -c examples/redsocks-macos-dns.conf
      - name: PF forwarding on disposable macOS runner
        if: runner.os == 'macOS'
        run: |
          sudo /sbin/pfctl -f /etc/pf.conf
          sudo python3 tests/macos_pf_test.py
          sudo python3 tests/macos_udp_test.py
      - name: TCP forwarding benchmark
        run: python3 tests/benchmark.py
      - name: Debug build
        run: |
          make clean
          make -j2 DBG_BUILD=1 CC=${{ matrix.cc }}
