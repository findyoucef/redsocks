base {
    log = stderr;
    log_info = on;
    log_debug = off;
    daemon = off;
    redirector = pf;
    // macOS checks root privileges on every PF lookup. Do not set `user`.
}

redsocks {
    local_ip = 127.0.0.1;
    local_port = 12345;
    ip = 127.0.0.1;
    port = 1080;
    type = socks5;
    splice = false;
    // login = "username";
    // password = "password";
}
