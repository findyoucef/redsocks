base {
    log = stderr;
    log_info = on;
    log_debug = off;
    daemon = off;
    redirector = pf;
    // Run as root. Do not set `user`.
}

// This section can also be added to redsocks-macos.conf for TCP + UDP.
redudp {
    // Redsocks creates this interface; configure it before loading PF rules.
    // Choose an unused utun number. Omit local_port and dest_ip/dest_port.
    local_tun = "utun100";
    ip = 127.0.0.1;
    port = 1080;
    // The SOCKS5 server must support UDP ASSOCIATE; ssh -D does not.
    // login = "username";
    // password = "password";
    udp_timeout = 30;
}
