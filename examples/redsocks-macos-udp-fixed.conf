base {
    log = stderr;
    log_info = on;
    log_debug = off;
    daemon = off;
    redirector = pf;
}

redudp {
    local_ip = 127.0.0.1;
    local_port = 12346;
    ip = 127.0.0.1;
    port = 1080;
    // The SOCKS5 server must support UDP ASSOCIATE; ssh -D does not.
    // login = "username";
    // password = "password";
    dest_ip = 1.1.1.1;
    dest_port = 53;
    udp_timeout = 30;
}
