base {
    log = stderr;
    log_info = on;
    daemon = off;
    redirector = pf;
    user = "nobody";
    group = "nobody";
}

redsocks {
    local_ip = 127.0.0.1;
    local_port = 12345;
    ip = 127.0.0.1;
    port = 1080;
    type = socks5;
    splice = false;
}

// Point a DNS client at 127.0.0.1:5353. This module connects to the remote
// DNS server over TCP; PF redirects that connection through redsocks.
// See doc/macos.md for the narrowly scoped PF rules for this configuration.
dnsu2t {
    local_ip = 127.0.0.1;
    local_port = 5353;
    remote_ip = 1.1.1.1;
    remote_port = 53;
    remote_timeout = 30;
    inflight_max = 16;
}
